name: Bug report
description: 报告可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先删除日志中的 Token、授权码、邮箱地址、公网 IP 和确认链接。
  - type: input
    id: version
    attributes:
      label: Version
      description: 使用的版本、tag 或 commit
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - 1Panel
        - Python directly
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: 请提供最小、完整的复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
